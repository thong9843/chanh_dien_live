<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay 9:16 · Chánh Điện Tịnh Tâm</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%AA%B7%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
/* Overlay for TikTok LIVE Studio / OBS window capture. Everything sits on a 1080×1920 stage scaled to the window. */
:root{
  --bg:#0c0705; --fg:#f6e9cf; --muted:#c9ad84; --gold:#e2b04f; --gold2:#ffd98a; --red:#7e1d12;
  --panel:rgba(28,13,7,.78); --line:rgba(226,176,79,.55);
  --display:"Noto Serif",Georgia,serif; --body:"Be Vietnam Pro",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:var(--body);color:var(--fg)}
#fit{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center center;overflow:hidden;background:var(--bg)}
#c{position:absolute;inset:0;width:1080px;height:1920px;z-index:1}
/* Nền tĩnh (ảnh cảnh + sáu thầy) là hai canvas DOM riêng, mờ chéo bằng CSS: canvas chính chỉ vẽ phần động nên GPU không phải xoá + vẽ lại cả khung 1080x1920 mỗi khung hình */
.bgl{position:absolute;inset:0;width:1080px;height:1920px;opacity:0;transform-origin:0 0;pointer-events:none}
.ui{position:absolute;z-index:3}
/* Hoành phi Nam Mô A Di Đà Phật: tấm biển ngang sơn mài đỏ sẫm, viền vàng kép mảnh, bốn góc có hoa văn vàng nhỏ, chữ Noto Serif vàng.
   Vị trí/kích thước từ content.json → plaque (top, width, height); căn giữa x 540, nằm trên hào quang và đầu tượng. */
#plaque{display:none;position:absolute;left:540px;transform:translateX(-50%);top:118px;width:420px;height:56px;box-sizing:border-box;pointer-events:none;z-index:2;
  background:linear-gradient(180deg,#5a1410 0%,#3a0b09 55%,#2b0705 100%);border:2px solid #d9b45a;border-radius:4px;
  box-shadow:inset 0 0 0 4px #3a0b09,inset 0 0 0 5px rgba(217,180,90,.85),0 6px 14px rgba(0,0,0,.55),inset 0 2px 6px rgba(255,160,120,.18);
  align-items:center;justify-content:center}
#plaque.on{display:flex}
#plaque i{position:absolute;width:9px;height:9px;border:2px solid #e9c872;box-sizing:border-box}
#plaque i::after{content:"";position:absolute;width:3px;height:3px;border-radius:50%;background:#e9c872}
#plaque i.tl{left:5px;top:5px;border-right:0;border-bottom:0;border-top-left-radius:3px}#plaque i.tl::after{left:3px;top:3px}
#plaque i.tr{right:5px;top:5px;border-left:0;border-bottom:0;border-top-right-radius:3px}#plaque i.tr::after{right:3px;top:3px}
#plaque i.bl{left:5px;bottom:5px;border-right:0;border-top:0;border-bottom-left-radius:3px}#plaque i.bl::after{left:3px;bottom:3px}
#plaque i.br{right:5px;bottom:5px;border-left:0;border-top:0;border-bottom-right-radius:3px}#plaque i.br::after{right:3px;bottom:3px}
#plaqueText{font-family:var(--display),"Noto Serif",Georgia,serif;font-weight:700;font-size:28px;color:#F3D58A;letter-spacing:2px;white-space:nowrap;line-height:1;
  text-shadow:0 1px 0 rgba(60,20,0,.9),0 0 8px rgba(243,213,138,.35)}
/* pills */
/* chip trạng thái: số người ở góc trên-trái, đồng hồ + ngày/đêm ở góc trên-phải (xếp dọc, không chip nào nằm trên đầu/hào quang tượng) */
#chipCount{left:24px;top:240px}
#chipsRight{right:24px;top:240px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pill{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:4px 16px;line-height:1.15;font-size:23px;font-weight:600;display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill small{font-size:16px;font-weight:500;color:var(--muted);line-height:1.05}
.dot{width:16px;height:16px;border-radius:50%;background:#46d36b;box-shadow:0 0 12px #46d36b}
#chipMore[hidden]{display:none}
#ambientPill{font-size:19px;padding:4px 14px;color:var(--gold2)}
/* Thẻ gợi ý bình luận (trái x 16–280, y 560–800) và Tri Ân (phải x 800–1064, y 560–800): ngoài vùng bình luận TikTok, gọn, bán trong suốt */
.card{background:rgba(20,10,6,.75);border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;font-size:16px;line-height:1.25}
#tips{left:16px;top:560px;width:264px;height:240px;box-sizing:border-box;display:flex;flex-direction:column;text-align:left;overflow:hidden}
#tips h3{margin:0 0 6px;font-family:var(--display);font-size:18px;line-height:1.2;color:var(--gold2);text-align:center;white-space:nowrap}
#tipsBody{display:grid}
#tipsBody .pg{grid-area:1/1;display:flex;flex-direction:column;gap:8px;opacity:0;transition:opacity .5s;pointer-events:none}
#tipsBody .pg.show{opacity:1;pointer-events:auto}
#tipsBody .pg div{font-size:22px;line-height:1.25;font-weight:600}
#tipsBody b{color:var(--gold2);font-size:25px;font-weight:800}
#merit{left:800px;top:560px;width:264px;height:240px;box-sizing:border-box;text-align:center;overflow:hidden}
#merit h3{margin:0 0 6px;font-family:var(--display);font-size:19px;line-height:1.2;color:var(--gold2);letter-spacing:.02em;white-space:nowrap}
#merit ol{margin:0;padding:0;list-style:none;text-align:left;display:grid;gap:7px}
#merit li{display:block;border-bottom:1px solid rgba(226,176,79,.25);padding-bottom:3px}
#merit li .nm{display:block;font-size:21px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#merit .empty{color:var(--muted);text-align:center;border:0;font-size:18px}
/* Thông báo: MỘT hàng đợi duy nhất, mọi thẻ dùng chung vùng #noticeBox (y 1000–1214, rộng ≤ 600, căn giữa x 540). Không bao giờ hai thẻ cùng lúc. */
#noticeBox{left:240px;top:1080px;width:600px;height:220px;display:grid;place-items:center;pointer-events:none;z-index:5}
#noticeBox > div{grid-area:1/1;width:100%;box-sizing:border-box;text-align:center;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}
#noticeBox > div.show{opacity:.88;transform:none}   /* bán trong suốt: vẫn thấy bàn thờ phía sau */
#gift,#toast,#ceremonyInvite{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:999px;padding:14px 30px;font-family:var(--display)}
#gift{border:2.5px solid var(--gold2);font-weight:700;font-size:31px;color:var(--gold2);background:radial-gradient(ellipse at 50% 0%,rgba(150,40,20,.9),rgba(50,14,6,.9));box-shadow:0 0 40px rgba(255,190,90,.4)}
#toast{border:2px solid var(--gold2);font-size:30px;color:var(--gold2);background:rgba(40,16,6,.9)}
#ceremonyInvite{border:2.5px solid var(--gold2);font-weight:700;font-size:30px;color:#fff2cc;background:linear-gradient(180deg,rgba(88,30,10,.94),rgba(38,14,6,.94));box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 28px rgba(255,204,102,.32)}
#chant{padding:14px 28px;border-radius:24px;border:2px solid var(--gold);background:rgba(40,18,8,.88)}
#chant h4{margin:0 0 6px;font-family:var(--display);color:var(--gold2);font-size:22px;letter-spacing:.1em;white-space:nowrap}
#chant p{margin:0;font-family:var(--display);font-style:italic;font-size:26px;line-height:1.35;overflow:hidden;text-wrap:balance}
/* thẻ quẻ: tối đa 3 dòng (tên quẻ 1 dòng + lời quẻ 2 dòng) */
#oracleCard{padding:14px 30px;border-radius:22px;border:4px solid #8c2015;background:linear-gradient(180deg,#fbf1d8 0%,#efe0ba 52%,#f7ebd0 100%);color:#2b1206;
  box-shadow:0 18px 55px rgba(0,0,0,.72),0 0 0 3px #e5b553,0 0 42px rgba(255,208,110,.38)}
#oracleTitle{font-family:var(--display);font-weight:700;font-size:31px;color:#7a180e;margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 rgba(255,255,255,.7)}
#oracleRecipient{font-family:var(--display);font-weight:600;font-size:22px;color:#8c2015;margin:0 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 rgba(255,255,255,.5)}
#oracleVerse{font-family:var(--display);font-style:italic;font-weight:700;font-size:26px;line-height:1.35;color:#220e05;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}

/* lớp phủ vùng an toàn TikTok (bật từ bảng điều khiển, chỉ để canh bố cục) */
#safe{position:absolute;inset:0;z-index:30;pointer-events:none;display:none}
#safe .z{position:absolute;box-sizing:border-box;background:rgba(255,40,40,.32);border:2px dashed rgba(255,150,150,.9);color:#fff;font:600 22px var(--body);padding:6px 10px;text-shadow:0 1px 3px #000}
/* enable sound (needed once: browsers block autoplay) */
#unmute{position:absolute;z-index:9;left:50%;top:960px;transform:translateX(-50%);font:600 36px var(--body);padding:22px 44px;border-radius:24px;border:3px solid var(--gold2);background:var(--red);color:#fff4dc;cursor:pointer}
#conn{position:absolute;z-index:4;right:16px;bottom:12px;font-size:20px;color:var(--muted);opacity:.6}
@media (prefers-reduced-motion:reduce){#noticeBox > div{transition:none}}

#prepScreen{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(12,7,5,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:opacity .6s ease;pointer-events:none}
#prepScreen.dismissed{opacity:0}
.prep-pill{padding:14px 34px;border-radius:999px;background:rgba(24,11,6,.85);border:1.5px solid rgba(226,176,79,.6);font-family:var(--display);font-size:24px;color:var(--gold2);letter-spacing:1px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <canvas id="bgA" class="bgl" width="1080" height="1920"></canvas>
  <canvas id="bgB" class="bgl" width="1080" height="1920"></canvas>
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="plaque" class="ui"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i><span id="plaqueText">Nam Mô A Di Đà Phật</span></div>
  <div id="chipCount" class="pill ui"><span class="dot"></span><span id="count">0/24</span><small id="watchLbl">đang<br>thiền</small></div>
  <div id="chipMore" class="pill ui" hidden></div>
  <div id="chipsRight" class="ui">
    <div class="pill">⏱ <span id="timer">00:00:00</span></div>
    <div class="pill" id="ambientPill">☀️ Ban ngày</div>
  </div>
  <div id="tips" class="card ui"><h3 id="tipsTitle"></h3><div id="tipsBody"><div class="pg"></div><div class="pg"></div></div></div>
  <div id="merit" class="card ui"><h3 id="meritTitle">✦ Tri Ân ✦</h3><ol id="meritList"><li class="empty">Chưa có</li></ol></div>
  <!-- Thông báo: một hàng đợi duy nhất (xem noticeEnqueue), mọi thẻ xếp chồng trong cùng một vùng -->
  <div id="noticeBox" class="ui">
    <div id="gift" class="ui"></div>
    <div id="toast" class="ui"></div>
    <div id="ceremonyInvite" class="ui" aria-live="polite"></div>
    <div id="chant" class="ui"><h4 id="chantTitle">✦ TỤNG KINH ĐỊNH KỲ ✦</h4><p id="chantText"></p></div>
    <div id="oracleCard" class="ui" aria-live="polite"><div id="oracleTitle"></div><div id="oracleRecipient"></div><p id="oracleVerse"></p></div>
  </div>

  <div id="safe"></div>
  <button id="unmute">🔔 Bấm để bật âm thanh</button>
  <div id="conn">đang kết nối…</div>
  <div id="prepScreen"><div class="prep-pill">Chánh điện đang chuẩn bị…</div></div>
</div></div>

<script src="/live/js/layout.js"></script>
<script src="/live/js/lunar.js"></script>
<script src="/live/js/canvas.js"></script>
<script>
/* ======================= stage fit ======================= */
const stage = document.getElementById('stage');
/* Canvas LUÔN vẽ nội bộ 1080×1920 (không đổi theo kích thước/độ phân giải cửa sổ); cửa sổ nhỏ hơn chỉ thu nhỏ hiển thị bằng CSS,
   cửa sổ đúng 1080×1920 (start-overlay.bat, lựa chọn 2) hiển thị 1:1 nên nét nhất. */
const mainCanvas = document.getElementById('c');
function fit(){
  if (mainCanvas.width !== 1080 || mainCanvas.height !== 1920){ mainCanvas.width = 1080; mainCanvas.height = 1920; }
  const s = Math.min(innerWidth/1080, innerHeight/1920); stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fit); fit();

const {
  Character,
  IncenseSmokeSystem,
  SilkMeritScroll,
  AmbientLightingSystem,
  CameraZoomController,
  CeremonyManager,
  setV3Config,
  setV4Config,
  ALTAR_DEFAULT,
  setBowConfig,
  setStandConfig,
} = window.ChanhDienCanvas;

const incenseFX = new IncenseSmokeSystem();
const meritScroll = new SilkMeritScroll();
const ambientFX = new AmbientLightingSystem();
const cameraZoom = new CameraZoomController();
const ceremonyManager = new CeremonyManager();   // nhiều lượt lễ song song (mỗi người một CeremonyDirector)
let silentUntil = 0;

/* ======================= assets ======================= */
const A = {};
const IMG = {
  hall:'/assets/hall.jpg', monk:'/assets/c_monk.png', nun:'/assets/c_nun.png', granny:'/assets/c_granny.png',
  man:'/assets/c_man.png', woman:'/assets/c_woman.png', child:'/assets/c_child.png', cushion:'/assets/cushion.png',
  lotus:'/assets/fx_lotus.png', halo:'/assets/fx_halo.png', bell:'/assets/fx_bell.png',
  incense:'/assets/fx_incense.png', petal:'/assets/fx_petal.png', scroll:'/assets/fx_scroll.png',
};
for (const [k,src] of Object.entries(IMG)){ const im=new Image(); im.src=src; A[k]=im; }
/* ======================= cảnh nền =======================
   Đường dẫn ảnh cố định ở client (giá trị scene từ server chỉ chọn khoá trong bảng này, không bao giờ là đường dẫn). hall = Chánh điện cũ. */
const SCENE_SRC = { day:'/assets/hall_mountain_day.jpg', dawn:'/assets/hall_mountain_dawn.jpg', night:'/assets/hall_mountain_night.jpg', ram:'/assets/hall_ram.jpg', phatdan:'/assets/hall_phatdan.jpg', vulan:'/assets/hall_vulan.jpg', old:'/assets/hall.jpg' };
const SCENE_DEFAULT = { fadeSec:2, dayFromHour:6, nightFromHour:18, halo:{ x:540, y:320, r:145, alpha:.16, breathSec:7, breathAmp:.3 } };
const sceneCfg = () => CONTENT?.scene || SCENE_DEFAULT;
const sceneImgs = { old: A.hall };
function sceneImg(name){
  if (!sceneImgs[name] && SCENE_SRC[name]){ const im = new Image(); im.src = SCENE_SRC[name]; sceneImgs[name] = im; }
  return sceneImgs[name];
}
// Cảnh đang hiển thị: auto = ngày/đêm theo giờ thực; giá trị lạ → auto
const SCENE_FIXED = ['day','dawn','night','ram','phatdan','vulan','old'];
const LUNAR_DEFAULT = { recheckMin:10, ram:{from:14,to:16}, phatdan:{month:4,from:8,to:15}, vulan:{month:7,from:1,to:15} };
// Cảnh lễ hội theo ngày âm (giờ Việt Nam), tính offline bằng js/lunar.js và tính lại mỗi scene.lunar.recheckMin phút (mặc định 10)
let lunarCache = { at:-1e12, scene:null };
function lunarScene(){
  const lc = sceneCfg().lunar || LUNAR_DEFAULT, now = Date.now();
  if (now - lunarCache.at >= lc.recheckMin * 60000){
    let sc = null; try { sc = window.Lunar ? window.Lunar.festivalScene(window.Lunar.nowLunar(now), lc) : null; } catch {}
    lunarCache = { at: now, scene: sc };
  }
  return lunarCache.scene;
}
function resolveScene(){
  const s = settings.scene;
  if (SCENE_FIXED.includes(s)) return s;
  if (s === 'lunar'){ const f = lunarScene(); if (f) return f; }
  const h = new Date().getHours(), c = sceneCfg();
  return (h >= c.dayFromHour && h < c.nightFromHour) ? 'day' : 'night';
}
// Ngày hay đêm (chỉ để chọn nhãn và ánh sáng của Chánh điện cũ): cảnh cũ vẫn theo giờ thực như trước
function sceneIsDay(sc = resolveScene()){
  if (sc === 'day' || sc === 'dawn' || sc === 'phatdan') return true;
  if (sc === 'night' || sc === 'ram' || sc === 'vulan') return false;
  const h = new Date().getHours(), c = sceneCfg();
  return h >= c.dayFromHour && h < c.nightFromHour;
}
ceremonyManager.assets = A;
// Ảnh tư thế đứng/đi bộ: chỉ nạp những file server báo là có thật (poseFiles trong snapshot), không đoán tên → không còn 404.
// Skin thiếu bộ stand/walkL/walkR giữ cách lên lễ cũ; kneel + prostrate tự dùng nếu có.
function loadPoseFiles(files){
  for (const f of (Array.isArray(files) ? files : [])){
    const m = /^(pose_[a-z]+_(?:stand|walkL|walkR|kneel|prostrate))\.png$/.exec(String(f)); if (!m || A[m[1]]) continue;
    const im = new Image(); im.src = '/assets/' + m[0]; A[m[1]] = im;
  }
}
/* ---- Ảnh đại diện: chỉ https + máy chủ CDN của TikTok (content.json → avatar.hosts; server cũng lọc một lần nữa). Ảnh nạp xong được vẽ sẵn
   thành vòng tròn avatarPx (có viền vàng) và cache; chưa có / lỗi / không hợp lệ thì dùng vòng tròn chữ cái đầu của tên. */
const AVATAR_HOSTS_DEFAULT = ['tiktokcdn.com','tiktokcdn-us.com','tiktokcdn-eu.com','tiktokv.com','tiktokv.us','ibyteimg.com','ibytedtos.com','muscdn.com'];
const safeUrlCache = new Map();   // kết quả kiểm tra theo chuỗi gốc: không phân tích URL lại mỗi khung hình
function safeAvatarUrl(u){
  u = String(u || '');
  if (!u) return '';
  let r = safeUrlCache.get(u);
  if (r === undefined){ r = safeAvatarUrlCheck(u); if (safeUrlCache.size > 600) safeUrlCache.clear(); safeUrlCache.set(u, r); }
  return r;
}
function safeAvatarUrlCheck(u){
  try {
    const url = new URL(String(u || '').slice(0, 400));
    if (url.protocol !== 'https:' || url.username || url.password || (url.port && url.port !== '443')) return '';
    const h = url.hostname.toLowerCase(), hosts = CONTENT?.avatar?.hosts || AVATAR_HOSTS_DEFAULT;
    return hosts.some(x => h === x || h.endsWith('.' + x)) ? url.href : '';
  } catch { return ''; }
}
const avatars = new Map();
const AVATAR_MAX = 200;   // LRU: giữ tối đa ~200 ảnh đại diện, bỏ ảnh lâu không dùng nhất
function avatar(url){
  url = safeAvatarUrl(url);
  if(!url) return null;
  let im=avatars.get(url);
  if(im){ avatars.delete(url); avatars.set(url,im); }
  else { im=new Image(); im.referrerPolicy='no-referrer'; im.onerror=()=>{ im.failed=true; }; im.src=url; avatars.set(url,im); if(avatars.size>AVATAR_MAX) avatars.delete(avatars.keys().next().value); }
  return im.naturalWidth?im:null;
}
const circleCache = new Map(), CIRCLE_MAX = 320;
function cachedCircle(key, build){
  let c = circleCache.get(key);
  if (c){ circleCache.delete(key); circleCache.set(key, c); return c; }
  c = build(); circleCache.set(key, c); if (circleCache.size > CIRCLE_MAX) circleCache.delete(circleCache.keys().next().value);
  return c;
}
const LETTER_COLORS = ['#8c2f1b','#7a5a14','#35603f','#2f5b72','#5b3a77','#7a3350','#4a4a2a','#8a4a12'];
function circleSprite(px, draw){
  const c = document.createElement('canvas'); c.width = c.height = px; const x = c.getContext('2d');
  x.save(); x.beginPath(); x.arc(px/2, px/2, px/2 - 1.5, 0, 6.2832); x.clip(); draw(x, px); x.restore();
  x.lineWidth = 2.5; x.strokeStyle = '#e2b04f'; x.beginPath(); x.arc(px/2, px/2, px/2 - 1.5, 0, 6.2832); x.stroke();
  return c;
}
// Vòng tròn đại diện của một người: ảnh TikTok nếu đã nạp, không thì chữ cái đầu (màu theo tên)
function avatarCircle(v, px){
  const im = avatar(v.avatar);
  if (im) return cachedCircle('i|' + im.src + '|' + px, () => circleSprite(px, (x, p) => x.drawImage(im, 0, 0, p, p)));
  const name = String(v.name || '?'), ch = (Array.from(name.trim())[0] || '?').toUpperCase();
  let h = 0; for (const c of name) h = (h * 31 + c.codePointAt(0)) >>> 0;
  const col = LETTER_COLORS[h % LETTER_COLORS.length];
  return cachedCircle('l|' + ch + '|' + col + '|' + px, () => circleSprite(px, (x, p) => {
    x.fillStyle = col; x.fillRect(0, 0, p, p);
    x.fillStyle = '#fff4d2'; x.font = `700 ${Math.round(p * .52)}px "Be Vietnam Pro",system-ui,sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(ch, p/2, p/2 + 1);
  }));
}

let cap = 24, seats = [];
function currentCols(){ return (GRID[cap] || GRID[24])[0]; }

function layout(c){
  cap = c; const [cols, rows] = GRID[c] || GRID[24]; seats = [];
  for (let r=0;r<rows;r++){
    const t = rows===1 ? .5 : r/(rows-1);                     // 0 = back row
    const y = FLOOR.yTop + (FLOOR.yBot-FLOOR.yTop)*t;
    const half = FLOOR.halfTop + (FLOOR.halfBot-FLOOR.halfTop)*t;
    const scale = (.26 + .24*t) * (6/cols) ** .75;
    const gap = 2*half/(cols-1) * .93;                        // room for one name tag
    for (let k=0;k<cols;k++){
      let u = (k-(cols-1)/2)/((cols-1)/2); u = Math.sign(u)*(.14 + .86*Math.abs(u));   // open a centre aisle
      seats.push({ x: 540 + u*half, y, scale, r, k, rows, gap });
    }
  }
  // fill front rows first, aisle side first, so a small crowd still looks full on camera
  seats.sort((a,b)=> (b.r-a.r) || (Math.abs(a.x-540)-Math.abs(b.x-540)));
  reseat();
}

let tipsTimer = null;
function startTips(title, lines, perPage, sec){
  clearInterval(tipsTimer);
  document.getElementById('tipsTitle').textContent = title || '';
  const els = [...document.querySelectorAll('#tipsBody .pg')];
  els.forEach(e => { e.classList.remove('show'); e.replaceChildren(); });
  if (!lines.length) return;
  const pages = []; for (let i = 0; i < lines.length; i += perPage) pages.push(lines.slice(i, i + perPage));
  const paint = (el, page) => { el.replaceChildren(); for (const line of page){ const d = document.createElement('div');
    line.split('**').forEach((p,i)=>{ if (!p) return; if (i%2){ const b=document.createElement('b'); b.textContent=p; d.append(b); } else d.append(p); });   // **đậm** → <b>, còn lại textContent
    el.append(d); } };
  let idx = 0, front = 0;
  paint(els[0], pages[0]); els[0].classList.add('show');
  if (pages.length < 2) return;
  tipsTimer = setInterval(() => {
    const back = 1 - front; idx = (idx + 1) % pages.length;
    paint(els[back], pages[idx]); els[front].classList.remove('show'); els[back].classList.add('show'); front = back;
  }, Math.max(2, sec) * 1000);
}

/* ======================= hàng đợi thông báo duy nhất =======================
   Mọi thông báo (Sổ Vàng quà ≥ 99 xu, quà nhỏ, tụng kinh, thẻ quẻ, mời lễ, toast tim/share) đi qua một hàng đợi và dùng chung một vùng:
   tại mọi thời điểm chỉ MỘT thẻ hiện, thẻ sau chờ thẻ trước tắt xong (+0,45s). Thứ tự: ưu tiên rồi đến lượt đến; thẻ chờ quá lâu thì bỏ. */
const noticeQ = []; let noticeCur = null, noticeNextAt = 0;
const NOTICE_MAX = 14;
function noticeEnqueue(it){
  it.at = performance.now();
  if (noticeQ.length >= NOTICE_MAX){                    // đầy: bỏ thẻ ưu tiên thấp nhất (mới nhất); thẻ mới thấp hơn nữa thì bỏ luôn
    let lo = 99, idx = -1; noticeQ.forEach((q,i)=>{ if (q.prio <= lo){ lo = q.prio; idx = i; } });
    if (it.prio <= lo) return false;
    noticeQ.splice(idx, 1);
  }
  let at = noticeQ.length; while (at > 0 && noticeQ[at-1].prio < it.prio) at--;
  noticeQ.splice(at, 0, it);
  return true;
}
function isSomeoneOnCushion(){
  for (const v of visitors.values()){ if (v.atAltarSpot) return true; }
  if (typeof ceremonyManager !== 'undefined' && ceremonyManager?.runs){
    for (const d of ceremonyManager.runs.values()){
      if (d.active && (d.atAltarSpot || d.phase === 'perform' || d.phase === 'kneel_down' || d.phase === 'kneel_bow' || d.phase === 'kneel_up' || d.phase === 'kneel_tail' || d.phase === 'fade_in_altar')) return true;
    }
  }
  return false;
}
function noticeStep(){
  const now = performance.now();
  if (noticeCur){
    const c = noticeCur;
    if ((c.isDone && c.isDone(now)) || now >= c.endAt){ c.hide(); noticeCur = null; noticeNextAt = now + 450; }
    return;
  }
  if (isSomeoneOnCushion()){
    // Đang có người trên bồ đoàn lễ: hàng đợi thông báo (y 1080–1300) tạm dừng chờ người lễ xong
    for (const it of noticeQ) it.at = now;
    return;
  }
  if (now < noticeNextAt) return;
  while (noticeQ.length){
    const it = noticeQ.shift();
    if (now - it.at > it.maxWait) continue;             // chờ quá lâu: bỏ
    noticeCur = it; it.startAt = now; it.endAt = now + it.dur; it.show();
    return;
  }
}

function splitChant(text, maxLen = 95){
  text = String(text || '').trim();
  if (!text) return [];
  if (text.length <= maxLen) return [text];
  const raw = text.split(/(?<=[.,;!?])\s+/);
  const segments = [];
  for (const s of raw){
    if (s.length <= maxLen) { segments.push(s); continue; }
    const words = s.split(/\s+/);
    let cur = '';
    for (const w of words){
      if (!cur) cur = w;
      else if ((cur + ' ' + w).length <= maxLen) cur += ' ' + w;
      else { segments.push(cur); cur = w; }
    }
    if (cur) segments.push(cur);
  }
  const parts = [];
  let curPart = '';
  for (const seg of segments){
    if (!curPart) curPart = seg;
    else if ((curPart + ' ' + seg).length <= maxLen) curPart += ' ' + seg;
    else { parts.push(curPart); curPart = seg; }
  }
  if (curPart) parts.push(curPart);
  return parts.length ? parts : [text];
}
function showChant(text){
  if (noticeCur || noticeQ.length) return;               // đang bận thì bỏ lượt chữ (giọng đọc vẫn đọc bình thường)

  const el = $el('chant');

      dur,
      maxWait: 30000,
      show(){ $el('chantText').textContent = part; el.classList.add('show'); },
      hide(){ el.classList.remove('show'); }
    });
  });
}

  const item = ttsQ.shift();
  const url = item.url;

  const targetName = (item.name || '').trim();

  const el = ttsElement();
  let done = false, watchdog = null;
  let started = false;

  const logStart = () => {
    if (started) return;
    started = true;
    sendLogToServer(`▶ Bắt đầu đọc #${readIdx} ${targetName}`.trim());
  };

  const finish = (delay, isError = false) => {
    if (done) return;
    done = true;
    clearTimeout(watchdog);
    el.onplay = el.onended = el.onerror = null;
    try { el.pause(); el.removeAttribute('src'); el.load(); } catch {}

  const stripped = norm.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'd');
  if (/(?:^|\s)!?\s*thap\s*nhang(?:\b|$)/.test(stripped)) return true;
  if (/(?:^|\s)!?\s*cung\s*bai(?:\b|$)/.test(stripped)) return true;
  if (/(?:^|\s)!?\s*quy\s*lay(?:\b|$)/.test(stripped)) return true;

  }
  // Thẻ người xem ngồi: thanh tên cho MỌI người đang ngồi (tối đa maxTags = 94)
  // Thanh tên người ngồi được phép đè nhau một phần: bỏ điều kiện bỏ qua khi giao với thanh tên người ngồi khác
  // Vẫn giữ: không đè thảm lễ và không đè thẻ người đang lên lễ
  // Thứ tự vẽ: người hoạt động lâu nhất vẽ trước, người mới nhất vẽ sau cùng (nằm trên)
  const cfg = getNameTagConfig();
  const maxTags = cfg.maxTags || 94;
  if (seatedCandidates.length > maxTags) {
    seatedCandidates.sort((a, b) => (b[0].lastActive || 0) - (a[0].lastActive || 0));
    seatedCandidates.length = maxTags;
  }
  seatedCandidates.sort((a, b) => (a[0].lastActive || 0) - (b[0].lastActive || 0));
  const rugBox = isCeremonyCode() && V4?.ceremony?.carpet && V4.ceremony.carpet.enabled !== false ? V4.ceremony.carpet : (V3?.rug || { x: 148, y: 1330, w: 784, h: 158 });
  for (const [lv, lh, la] of seatedCandidates){
    const box = getLabelBox(lv, lh);
    if (boxesIntersect(box, rugBox)) continue;
    if (drawnCeremonyBoxes.some(b => boxesIntersect(box, b))) continue;
    drawLabelDirect(lv, box, la);
  }
  const elCard = document.getElementById('oracleCard');
  let cardBox = null;
  if (elCard && elCard.classList.contains('show')) {
    cardBox = { left: 230, right: 850, top: 1060, bottom: 1320 };
  }
  const resolvedBubbles = (typeof window.resolveBubbleCollisions === 'function')
    ? window.resolveBubbleCollisions(bubbles, (t, s) => {
        const fs = Math.max(18, Math.round(26 * s / 0.4));
        ctx.font = `500 ${fs}px "Be Vietnam Pro",system-ui,sans-serif`;
        let str = t;
        while (ctx.measureText(str).width > 320 && str.length > 4) str = str.slice(0, -2);
        if (str !== t) str = str.trimEnd() + '…';
        return { w: ctx.measureText(str).width + fs * 1.1, h: fs * 1.6 };
      }, cardBox)
    : bubbles;
  for (const [bt, bx, by, bs, ba] of resolvedBubbles){ ctx.save(); ctx.globalAlpha = ba; bubble(bt, bx, by, bs); ctx.restore(); }

  // 6. Vật phẩm cúng dường bay lên, cánh sen & tim (hạt hết hạn trả về pool)
  let wf=0;
  for (let i=0;i<fx.length;i++){ const f=fx[i]; f.t+=dt; const k=f.t/f.life; if(k>=1){ freeFx.push(f); continue; } const pop=1-Math.pow(1-Math.min(1,f.t*4),3);
    ctx.save(); ctx.globalAlpha=k<.75?1:(1-k)/.25; sprite(A[f.kind],f.x,f.y-k*170,f.scale*(.6+.4*pop)); ctx.restore(); fx[wf++]=f; }
  fx.length=wf;
  let wp=0;
  for (let i=0;i<petals.length;i++){ const p=petals[i]; p.t+=dt; if(p.t>p.life){ freePetals.push(p); continue; } p.x+=p.vx*dt+Math.sin(p.t*3+p.ph)*20*dt; p.y+=p.vy*dt;
    if (p.y<FACE.y1 && p.x>FACE.x0 && p.x<FACE.x1){ p.x = p.x<540 ? FACE.x0 : FACE.x1; p.vx = (p.x<540?-1:1)*Math.abs(p.vx); }   // cánh hoa không bay qua vùng mặt (x 400–680, y 240–620)
    ctx.save(); ctx.globalAlpha=Math.min(1,p.life-p.t); ctx.translate(p.x,p.y);
    if (p.heart){ ctx.fillStyle='#ff5a7a'; ctx.font='34px serif'; ctx.textAlign='center'; ctx.fillText('♥',0,0); } else { ctx.rotate(Math.sin(p.t*2+p.ph)*.6); sprite(A.petal,0,0,p.s,.5); }
    ctx.restore(); petals[wp++]=p; }
  petals.length=wp;
  cameraZoom.restoreTransform(ctx);

  // 7. Sổ Vàng Công Đức Cuộn Thư Pháp 2.5D
  meritScroll.updateAndDraw(ctx, dt, t, A.lotus);

  // 8. Dòng tri ân tác giả gốc
  drawCredit(now);
}

const credit = { enabled:true, text:'✦ Mã nguồn được chia sẻ bởi Kent Juno ✦', everyMin:[5,10], showSec:7, y:1222, fontPx:22 };
let creditNext = 0, creditStart = -1e9;
function drawCredit(now){
  if (!credit.enabled || !credit.text) return;
  const [lo, hi] = credit.everyMin;
  if (!creditNext) creditNext = now + (lo + Math.random()*(hi-lo))*60000;
  if (now > creditNext){ creditStart = now; creditNext = now + (lo + Math.random()*(hi-lo))*60000; }
  const e = (now - creditStart)/1000, dur = credit.showSec;
  if (e < 0 || e > dur) return;
  const k = Math.max(0, Math.min(1, e*1.6, (dur-e)*1.6)), h = Math.round(credit.fontPx*1.7);
  ctx.save(); ctx.setTransform(ctx.canvas.width/1080, 0, 0, ctx.canvas.height/1920, 0, 0); ctx.globalAlpha = k;
  ctx.font = `600 ${credit.fontPx}px "Noto Serif",Georgia,serif`;
  const w = ctx.measureText(credit.text).width + 44, x = 540 - w/2, y = credit.y - h/2;
  ctx.fillStyle = 'rgba(40,16,6,.88)'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, h/2) : ctx.rect(x, y, w, h); ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(226,176,79,.9)'; ctx.stroke();
  ctx.fillStyle = '#ffd98a'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(credit.text, 540, credit.y + 1);
  ctx.restore();
}
layout(24); updateAmbientBadge();
// VIỆC 1: Preload + img.decode() toàn bộ nền đang chọn + c_* + pose_* TRƯỚC khi vẽ khung đầu
async function initStartup(){
  try {
    await Promise.race([
      Promise.all(['600 30px "Be Vietnam Pro"','500 26px "Be Vietnam Pro"','700 24px "Noto Serif"','italic 700 42px "Noto Serif"'].map(f=>document.fonts.load(f).catch(()=>[]))).then(()=>document.fonts.ready),
      new Promise(r=>setTimeout(r,3000)),
    ]);
  } catch {}
  fontsOk = true;

  // 1. Decode nền đang chọn
  const sc = resolveScene();
  const bgImg = sceneImg(sc);
  if (bgImg){
    try { if (bgImg.decode) await bgImg.decode(); } catch {}
  }
  const bgMs = Math.round(performance.now() - overlayStartTime);
  sendStartupMetric('ảnh nền decode xong', bgMs);

  // 2. Decode toàn bộ sprite c_*, pose_*, cushion, fx_*
  const sprites = [
    A.monk, A.nun, A.granny, A.man, A.woman, A.child,
    A.cushion, A.lotus, A.halo, A.bell, A.incense, A.petal, A.scroll
  ].filter(Boolean);
  for (const [k, im] of Object.entries(A)){
    if (k.startsWith('pose_') && !sprites.includes(im)) sprites.push(im);
  }
  await Promise.allSettled(sprites.map(async im => {
    if (im?.decode) { try { await im.decode(); } catch {} }
  }));
  const spMs = Math.round(performance.now() - overlayStartTime);
  sendStartupMetric('tất cả sprite decode xong', spMs);
  decodeDone = true;
  checkPrepDone();

  // 3. Bắt đầu vẽ
  renderStatic();
  lastDraw = performance.now();
  requestAnimationFrame(frame);
}
initStartup();
</script>
