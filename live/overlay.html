<head>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%AA%B7%3C/text%3E%3C/svg%3E">

<style>
/* Overlay for TikTok LIVE Studio / OBS window capture. Everything sits on a 1080×1920 stage scaled to the window. */
:root{
  --bg:#0c0705; --fg:#f6e9cf; --muted:#c9ad84; --gold:#e2b04f; --gold2:#ffd98a; --red:#7e1d12;
  --panel:rgba(28,13,7,.78); --line:rgba(226,176,79,.55);
  --display:"Noto Serif",Georgia,serif; --body:"Be Vietnam Pro",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:var(--body);color:var(--fg)}
#fit{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center center;overflow:hidden;background:var(--bg)}
#c{position:absolute;inset:0;width:1080px;height:1920px;z-index:1}
/* Nền tĩnh (ảnh cảnh + sáu thầy) là hai canvas DOM riêng, mờ chéo bằng CSS: canvas chính chỉ vẽ phần động nên GPU không phải xoá + vẽ lại cả khung 1080x1920 mỗi khung hình */
.bgl{position:absolute;inset:0;width:1080px;height:1920px;opacity:0;transform-origin:0 0;pointer-events:none}
.ui{position:absolute;z-index:3}
/* title plaque: dòng chữ Nam Mô A Di Đà Phật mạ vàng chạm khắc thanh tịnh trên cùng */
#plaque{display:none;position:absolute;left:50%;transform:translateX(-50%);top:185px;width:100%;max-width:440px;text-align:center;pointer-events:none;z-index:2}
#plaque.on{display:block}
#plaqueText{font-family:var(--display), "Noto Serif", Georgia, serif;font-weight:700;font-size:30px;color:#F3D58A;
  letter-spacing:2px;white-space:nowrap;display:inline-block;line-height:1.2;
  text-shadow:0 0 10px rgba(243,213,138,0.65), 0 0 22px rgba(212,168,75,0.35), 0 2px 4px rgba(0,0,0,0.85)}
/* pills */
/* chip trạng thái: số người ở góc trên-trái, đồng hồ + ngày/đêm ở góc trên-phải (xếp dọc, không chip nào nằm trên đầu/hào quang tượng) */
#chipCount{left:24px;top:240px}
#chipsRight{right:24px;top:240px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pill{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:4px 16px;line-height:1.15;font-size:23px;font-weight:600;display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill small{font-size:16px;font-weight:500;color:var(--muted);line-height:1.05}
.dot{width:16px;height:16px;border-radius:50%;background:#46d36b;box-shadow:0 0 12px #46d36b}
#chipMore[hidden]{display:none}
#ambientPill{font-size:19px;padding:4px 14px;color:var(--gold2)}
/* Hai thẻ ở chân màn hình (y 1520–1700): gợi ý bình luận (trái, x 16–330) và Tri Ân (phải, x 750–1064). Gọn, không làm mờ nền bằng backdrop-filter (tốn CPU khi không có GPU). */
.card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-size:20px;line-height:1.3}
#tips{left:16px;top:1520px;width:314px;height:auto;box-sizing:border-box;display:flex;flex-direction:column;text-align:left;overflow:hidden}
#tips h3{margin:0 0 6px;font-family:var(--display);font-size:17px;line-height:1.2;color:var(--gold2);text-align:center;white-space:nowrap}
#tipsBody{display:grid}
#tipsBody .pg{grid-area:1/1;display:flex;flex-direction:column;gap:5px;opacity:0;transition:opacity .5s;pointer-events:none}
#tipsBody .pg.show{opacity:1;pointer-events:auto}
#tipsBody .pg div{font-size:18px;line-height:1.28}
#tipsBody b{color:var(--gold2)}
#merit{left:750px;top:1520px;width:314px;height:auto;box-sizing:border-box;text-align:center;overflow:hidden}
#merit h3{margin:0 0 6px;font-family:var(--display);font-size:20px;line-height:1.2;color:var(--gold2);letter-spacing:.02em;white-space:nowrap}
#merit ol{margin:0;padding:0;list-style:none;text-align:left;display:grid;gap:5px}
#merit li{display:block;border-bottom:1px solid rgba(226,176,79,.25);padding-bottom:4px}
#merit li .nm{display:block;font-size:22px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#merit .empty{color:var(--muted);text-align:center;border:0;font-size:20px}
/* Thông báo: MỘT hàng đợi duy nhất, mọi thẻ dùng chung vùng #noticeBox (y 1000–1214, rộng ≤ 600, căn giữa x 540). Không bao giờ hai thẻ cùng lúc. */
#noticeBox{left:240px;top:1080px;width:600px;height:220px;display:grid;place-items:center;pointer-events:none;z-index:5}
#noticeBox > div{grid-area:1/1;width:100%;box-sizing:border-box;text-align:center;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}
#noticeBox > div.show{opacity:.88;transform:none}   /* bán trong suốt: vẫn thấy bàn thờ phía sau */
#gift,#toast,#ceremonyInvite{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:999px;padding:14px 30px;font-family:var(--display)}
#gift{border:2.5px solid var(--gold2);font-weight:700;font-size:31px;color:var(--gold2);background:radial-gradient(ellipse at 50% 0%,rgba(150,40,20,.9),rgba(50,14,6,.9));box-shadow:0 0 40px rgba(255,190,90,.4)}
#toast{border:2px solid var(--gold2);font-size:30px;color:var(--gold2);background:rgba(40,16,6,.9)}
#ceremonyInvite{border:2.5px solid var(--gold2);font-weight:700;font-size:30px;color:#fff2cc;background:linear-gradient(180deg,rgba(88,30,10,.94),rgba(38,14,6,.94));box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 28px rgba(255,204,102,.32)}
#chant{padding:14px 28px;border-radius:24px;border:2px solid var(--gold);background:rgba(40,18,8,.88)}
#chant h4{margin:0 0 6px;font-family:var(--display);color:var(--gold2);font-size:22px;letter-spacing:.1em;white-space:nowrap}
#chant p{margin:0;font-family:var(--display);font-style:italic;font-size:26px;line-height:1.35;overflow:hidden;text-wrap:balance}
/* thẻ quẻ: tối đa 3 dòng (tên quẻ 1 dòng + lời quẻ 2 dòng) */
#oracleCard{padding:14px 30px;border-radius:22px;border:4px solid #8c2015;background:linear-gradient(180deg,#fbf1d8 0%,#efe0ba 52%,#f7ebd0 100%);color:#2b1206;
  box-shadow:0 18px 55px rgba(0,0,0,.72),0 0 0 3px #e5b553,0 0 42px rgba(255,208,110,.38)}
#oracleTitle{font-family:var(--display);font-weight:700;font-size:31px;color:#7a180e;margin:0 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 rgba(255,255,255,.7)}
#oracleVerse{font-family:var(--display);font-style:italic;font-weight:700;font-size:26px;line-height:1.35;color:#220e05;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}

/* lớp phủ vùng an toàn TikTok (bật từ bảng điều khiển, chỉ để canh bố cục) */
#safe{position:absolute;inset:0;z-index:30;pointer-events:none;display:none}
#safe .z{position:absolute;box-sizing:border-box;background:rgba(255,40,40,.32);border:2px dashed rgba(255,150,150,.9);color:#fff;font:600 22px var(--body);padding:6px 10px;text-shadow:0 1px 3px #000}
/* enable sound (needed once: browsers block autoplay) */
#unmute{position:absolute;z-index:9;left:50%;top:1540px;transform:translateX(-50%);font:600 36px var(--body);padding:22px 44px;border-radius:24px;border:3px solid var(--gold2);background:var(--red);color:#fff4dc;cursor:pointer}
#conn{position:absolute;z-index:4;right:16px;bottom:12px;font-size:20px;color:var(--muted);opacity:.6}
@media (prefers-reduced-motion:reduce){#noticeBox > div{transition:none}}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <canvas id="bgA" class="bgl" width="1080" height="1920"></canvas>
  <canvas id="bgB" class="bgl" width="1080" height="1920"></canvas>
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="plaque" class="ui"><span id="plaqueText">Nam Mô A Di Đà Phật</span></div>
  <div id="chipCount" class="pill ui"><span class="dot"></span><span id="count">0/24</span><small id="watchLbl">đang<br>thiền</small></div>
  <div id="chipMore" class="pill ui" hidden></div>
  <div id="chipsRight" class="ui">
    <div class="pill">⏱ <span id="timer">00:00:00</span></div>
    <div class="pill" id="ambientPill">☀️ Ban ngày</div>
  </div>
  <div id="tips" class="card ui"><h3 id="tipsTitle"></h3><div id="tipsBody"><div class="pg"></div><div class="pg"></div></div></div>
  <div id="merit" class="card ui"><h3 id="meritTitle">✦ Tri Ân ✦</h3><ol id="meritList"><li class="empty">Chưa có</li></ol></div>
  <!-- Thông báo: một hàng đợi duy nhất (xem noticeEnqueue), mọi thẻ xếp chồng trong cùng một vùng -->
  <div id="noticeBox" class="ui">
    <div id="gift" class="ui"></div>
    <div id="toast" class="ui"></div>
    <div id="ceremonyInvite" class="ui" aria-live="polite"></div>
    <div id="chant" class="ui"><h4 id="chantTitle">✦ TỤNG KINH ĐỊNH KỲ ✦</h4><p id="chantText"></p></div>
    <div id="oracleCard" class="ui" aria-live="polite"><div id="oracleTitle"></div><p id="oracleVerse"></p></div>
  </div>

  <div id="safe"></div>
  <button id="unmute">🔔 Bấm để bật âm thanh</button>
  <div id="conn">đang kết nối…</div>
</div></div>

<script src="/live/js/layout.js"></script>
<script src="/live/js/lunar.js"></script>
<script src="/live/js/canvas.js"></script>
<script>
/* ======================= stage fit ======================= */
const stage = document.getElementById('stage');
/* Canvas LUÔN vẽ nội bộ 1080×1920 (không đổi theo kích thước/độ phân giải cửa sổ); cửa sổ nhỏ hơn chỉ thu nhỏ hiển thị bằng CSS,
   cửa sổ đúng 1080×1920 (start-overlay.bat, lựa chọn 2) hiển thị 1:1 nên nét nhất. */
const mainCanvas = document.getElementById('c');
function fit(){
  if (mainCanvas.width !== 1080 || mainCanvas.height !== 1920){ mainCanvas.width = 1080; mainCanvas.height = 1920; }
  const s = Math.min(innerWidth/1080, innerHeight/1920); stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fit); fit();

const {
  Character,
  IncenseSmokeSystem,
  SilkMeritScroll,
  AmbientLightingSystem,
  CameraZoomController,
  CeremonyManager,
  setV3Config,
  ALTAR_DEFAULT,
  setBowConfig,
  setStandConfig,
} = window.ChanhDienCanvas;

const incenseFX = new IncenseSmokeSystem();
const meritScroll = new SilkMeritScroll();
const ambientFX = new AmbientLightingSystem();
const cameraZoom = new CameraZoomController();
const ceremonyManager = new CeremonyManager();   // nhiều lượt lễ song song (mỗi người một CeremonyDirector)
let silentUntil = 0;

/* ======================= assets ======================= */
const A = {};
const IMG = {
  hall:'/assets/hall.jpg', monk:'/assets/c_monk.png', nun:'/assets/c_nun.png', granny:'/assets/c_granny.png',
  man:'/assets/c_man.png', woman:'/assets/c_woman.png', child:'/assets/c_child.png',
  lotus:'/assets/fx_lotus.png', halo:'/assets/fx_halo.png', bell:'/assets/fx_bell.png',
  incense:'/assets/fx_incense.png', petal:'/assets/fx_petal.png', scroll:'/assets/fx_scroll.png',
};
for (const [k,src] of Object.entries(IMG)){ const im=new Image(); im.src=src; A[k]=im; }
/* ======================= cảnh nền =======================
   Đường dẫn ảnh cố định ở client (giá trị scene từ server chỉ chọn khoá trong bảng này, không bao giờ là đường dẫn). hall = Chánh điện cũ. */
const SCENE_SRC = { day:'/assets/hall_mountain_day.jpg', dawn:'/assets/hall_mountain_dawn.jpg', night:'/assets/hall_mountain_night.jpg', ram:'/assets/hall_ram.jpg', phatdan:'/assets/hall_phatdan.jpg', vulan:'/assets/hall_vulan.jpg', old:'/assets/hall.jpg' };
const SCENE_DEFAULT = { fadeSec:2, dayFromHour:6, nightFromHour:18, halo:{ x:540, y:320, r:145, alpha:.16, breathSec:7, breathAmp:.3 } };
const sceneCfg = () => CONTENT?.scene || SCENE_DEFAULT;
const sceneImgs = { old: A.hall };
function sceneImg(name){
  if (!sceneImgs[name] && SCENE_SRC[name]){ const im = new Image(); im.src = SCENE_SRC[name]; sceneImgs[name] = im; }
  return sceneImgs[name];
}
// Cảnh đang hiển thị: auto = ngày/đêm theo giờ thực; giá trị lạ → auto
const SCENE_FIXED = ['day','dawn','night','ram','phatdan','vulan','old'];
const LUNAR_DEFAULT = { recheckMin:10, ram:{from:14,to:16}, phatdan:{month:4,from:8,to:15}, vulan:{month:7,from:1,to:15} };
// Cảnh lễ hội theo ngày âm (giờ Việt Nam), tính offline bằng js/lunar.js và tính lại mỗi scene.lunar.recheckMin phút (mặc định 10)
let lunarCache = { at:-1e12, scene:null };
function lunarScene(){
  const lc = sceneCfg().lunar || LUNAR_DEFAULT, now = Date.now();
  if (now - lunarCache.at >= lc.recheckMin * 60000){
    let sc = null; try { sc = window.Lunar ? window.Lunar.festivalScene(window.Lunar.nowLunar(now), lc) : null; } catch {}
    lunarCache = { at: now, scene: sc };
  }
  return lunarCache.scene;
}
function resolveScene(){
  const s = settings.scene;
  if (SCENE_FIXED.includes(s)) return s;
  if (s === 'lunar'){ const f = lunarScene(); if (f) return f; }
  const h = new Date().getHours(), c = sceneCfg();
  return (h >= c.dayFromHour && h < c.nightFromHour) ? 'day' : 'night';
}
// Ngày hay đêm (chỉ để chọn nhãn và ánh sáng của Chánh điện cũ): cảnh cũ vẫn theo giờ thực như trước
function sceneIsDay(sc = resolveScene()){
  if (sc === 'day' || sc === 'dawn' || sc === 'phatdan') return true;
  if (sc === 'night' || sc === 'ram' || sc === 'vulan') return false;
  const h = new Date().getHours(), c = sceneCfg();
  return h >= c.dayFromHour && h < c.nightFromHour;
}
ceremonyManager.assets = A;
// Ảnh tư thế đứng/đi bộ: chỉ nạp những file server báo là có thật (poseFiles trong snapshot), không đoán tên → không còn 404.
// Skin thiếu bộ stand/walkL/walkR giữ cách lên lễ cũ; kneel + prostrate tự dùng nếu có.
function loadPoseFiles(files){
  for (const f of (Array.isArray(files) ? files : [])){
    const m = /^(pose_[a-z]+_(?:stand|walkL|walkR|kneel|prostrate))\.png$/.exec(String(f)); if (!m || A[m[1]]) continue;
    const im = new Image(); im.src = '/assets/' + m[0]; A[m[1]] = im;
  }
}
/* ---- Ảnh đại diện: chỉ https + máy chủ CDN của TikTok (content.json → avatar.hosts; server cũng lọc một lần nữa). Ảnh nạp xong được vẽ sẵn
   thành vòng tròn avatarPx (có viền vàng) và cache; chưa có / lỗi / không hợp lệ thì dùng vòng tròn chữ cái đầu của tên. */
const AVATAR_HOSTS_DEFAULT = ['tiktokcdn.com','tiktokcdn-us.com','tiktokcdn-eu.com','tiktokv.com','tiktokv.us','ibyteimg.com','ibytedtos.com','muscdn.com'];
const safeUrlCache = new Map();   // kết quả kiểm tra theo chuỗi gốc: không phân tích URL lại mỗi khung hình
function safeAvatarUrl(u){
  u = String(u || '');
  if (!u) return '';
  let r = safeUrlCache.get(u);
  if (r === undefined){ r = safeAvatarUrlCheck(u); if (safeUrlCache.size > 600) safeUrlCache.clear(); safeUrlCache.set(u, r); }
  return r;
}
function safeAvatarUrlCheck(u){
  try {
    const url = new URL(String(u || '').slice(0, 400));
    if (url.protocol !== 'https:' || url.username || url.password || (url.port && url.port !== '443')) return '';
    const h = url.hostname.toLowerCase(), hosts = CONTENT?.avatar?.hosts || AVATAR_HOSTS_DEFAULT;
    return hosts.some(x => h === x || h.endsWith('.' + x)) ? url.href : '';
  } catch { return ''; }
}
const avatars = new Map();
const AVATAR_MAX = 200;   // LRU: giữ tối đa ~200 ảnh đại diện, bỏ ảnh lâu không dùng nhất
function avatar(url){
  url = safeAvatarUrl(url);
  if(!url) return null;
  let im=avatars.get(url);
  if(im){ avatars.delete(url); avatars.set(url,im); }
  else { im=new Image(); im.referrerPolicy='no-referrer'; im.onerror=()=>{ im.failed=true; }; im.src=url; avatars.set(url,im); if(avatars.size>AVATAR_MAX) avatars.delete(avatars.keys().next().value); }
  return im.naturalWidth?im:null;
}
const circleCache = new Map(), CIRCLE_MAX = 320;
function cachedCircle(key, build){
  let c = circleCache.get(key);
  if (c){ circleCache.delete(key); circleCache.set(key, c); return c; }
  c = build(); circleCache.set(key, c); if (circleCache.size > CIRCLE_MAX) circleCache.delete(circleCache.keys().next().value);
  return c;
}
const LETTER_COLORS = ['#8c2f1b','#7a5a14','#35603f','#2f5b72','#5b3a77','#7a3350','#4a4a2a','#8a4a12'];
function circleSprite(px, draw){
  const c = document.createElement('canvas'); c.width = c.height = px; const x = c.getContext('2d');
  x.save(); x.beginPath(); x.arc(px/2, px/2, px/2 - 1.5, 0, 6.2832); x.clip(); draw(x, px); x.restore();
  x.lineWidth = 2.5; x.strokeStyle = '#e2b04f'; x.beginPath(); x.arc(px/2, px/2, px/2 - 1.5, 0, 6.2832); x.stroke();
  return c;
}
// Vòng tròn đại diện của một người: ảnh TikTok nếu đã nạp, không thì chữ cái đầu (màu theo tên)
function avatarCircle(v, px){
  const im = avatar(v.avatar);
  if (im) return cachedCircle('i|' + im.src + '|' + px, () => circleSprite(px, (x, p) => x.drawImage(im, 0, 0, p, p)));
  const name = String(v.name || '?'), ch = (Array.from(name.trim())[0] || '?').toUpperCase();
  let h = 0; for (const c of name) h = (h * 31 + c.codePointAt(0)) >>> 0;
  const col = LETTER_COLORS[h % LETTER_COLORS.length];
  return cachedCircle('l|' + ch + '|' + col + '|' + px, () => circleSprite(px, (x, p) => {
    x.fillStyle = col; x.fillRect(0, 0, p, p);
    x.fillStyle = '#fff4d2'; x.font = `700 ${Math.round(p * .52)}px "Be Vietnam Pro",system-ui,sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(ch, p/2, p/2 + 1);
  }));
}

/* ======================= seats ======================= */
let FLOOR = { yTop: 1430, yBot: 1870, halfTop: 330, halfBot: 470 };
let LAYOUT = { halo:{y:320,scale:1.9,alpha:.12}, candleGlow:{x:0,y:250,w:1080,h:1050}, incense:{y:990}, altarSpot:ALTAR_DEFAULT };
const GRID = { 24:[6,4], 36:[6,6], 64:[8,8], 100:[10,10] };
let cap = 24, seats = [];
function currentCols(){ return (GRID[cap] || GRID[24])[0]; }

function layout(c){
  cap = c; const [cols, rows] = GRID[c] || GRID[24]; seats = [];
  for (let r=0;r<rows;r++){
    const t = rows===1 ? .5 : r/(rows-1);                     // 0 = back row
    const y = FLOOR.yTop + (FLOOR.yBot-FLOOR.yTop)*t;
    const half = FLOOR.halfTop + (FLOOR.halfBot-FLOOR.halfTop)*t;
    const scale = (.26 + .24*t) * (6/cols) ** .75;
    const gap = 2*half/(cols-1) * .93;                        // room for one name tag
    for (let k=0;k<cols;k++){
      let u = (k-(cols-1)/2)/((cols-1)/2); u = Math.sign(u)*(.14 + .86*Math.abs(u));   // open a centre aisle
      seats.push({ x: 540 + u*half, y, scale, r, k, rows, gap });
    }
  }
  // fill front rows first, aisle side first, so a small crowd still looks full on camera
  seats.sort((a,b)=> (b.r-a.r) || (Math.abs(a.x-540)-Math.abs(b.x-540)));
  reseat();
}

const visitors = new Map();  // id -> Character
let order = [];               // ids in seating order (bố cục cũ)
// Chánh điện cũ (scene "old") dùng lưới theo số người; mọi cảnh ảnh mới dùng bố cục v3: 100 chỗ cố định hai bên lối giữa, server cấp chỉ số chỗ (p.seat).
let V3 = null, V3_SEATS = [];
const isV3 = () => resolveScene() !== 'old' && !!V3 && V3_SEATS.length > 0;
function reseat(){
  order = order.filter(id => visitors.has(id));
  const cols = currentCols();
  if (isV3()){
    for (const v of visitors.values()){ const s = V3_SEATS[v.seatIdx]; if (s) v.assignSeat(s, false, FLOOR, cols); }
    return;
  }
  order.forEach((id,i) => {
    const v = visitors.get(id), s = seats[i];
    if (!v || !s) return;
    v.assignSeat(s, false, FLOOR, cols);
  });
}

let tipsTimer = null;
function startTips(title, lines, perPage, sec){
  clearInterval(tipsTimer);
  document.getElementById('tipsTitle').textContent = title || '';
  const els = [...document.querySelectorAll('#tipsBody .pg')];
  els.forEach(e => { e.classList.remove('show'); e.replaceChildren(); });
  if (!lines.length) return;
  const pages = []; for (let i = 0; i < lines.length; i += perPage) pages.push(lines.slice(i, i + perPage));
  const paint = (el, page) => { el.replaceChildren(); for (const line of page){ const d = document.createElement('div');
    line.split('**').forEach((p,i)=>{ if (!p) return; if (i%2){ const b=document.createElement('b'); b.textContent=p; d.append(b); } else d.append(p); });   // **đậm** → <b>, còn lại textContent
    el.append(d); } };
  let idx = 0, front = 0;
  paint(els[0], pages[0]); els[0].classList.add('show');
  if (pages.length < 2) return;
  tipsTimer = setInterval(() => {
    const back = 1 - front; idx = (idx + 1) % pages.length;
    paint(els[back], pages[idx]); els[front].classList.remove('show'); els[back].classList.add('show'); front = back;
  }, Math.max(2, sec) * 1000);
}

/* ======================= hàng đợi thông báo duy nhất =======================
   Mọi thông báo (Sổ Vàng quà ≥ 99 xu, quà nhỏ, tụng kinh, thẻ quẻ, mời lễ, toast tim/share) đi qua một hàng đợi và dùng chung một vùng:
   tại mọi thời điểm chỉ MỘT thẻ hiện, thẻ sau chờ thẻ trước tắt xong (+0,45s). Thứ tự: ưu tiên rồi đến lượt đến; thẻ chờ quá lâu thì bỏ. */
const noticeQ = []; let noticeCur = null, noticeNextAt = 0;
const NOTICE_MAX = 14;
function noticeEnqueue(it){
  it.at = performance.now();
  if (noticeQ.length >= NOTICE_MAX){                    // đầy: bỏ thẻ ưu tiên thấp nhất (mới nhất); thẻ mới thấp hơn nữa thì bỏ luôn
    let lo = 99, idx = -1; noticeQ.forEach((q,i)=>{ if (q.prio <= lo){ lo = q.prio; idx = i; } });
    if (it.prio <= lo) return false;
    noticeQ.splice(idx, 1);
  }
  let at = noticeQ.length; while (at > 0 && noticeQ[at-1].prio < it.prio) at--;
  noticeQ.splice(at, 0, it);
  return true;
}
function noticeStep(){
  const now = performance.now();
  if (noticeCur){
    const c = noticeCur;
    if ((c.isDone && c.isDone(now)) || now >= c.endAt){ c.hide(); noticeCur = null; noticeNextAt = now + 450; }
    return;
  }
  if (now < noticeNextAt) return;
  while (noticeQ.length){
    const it = noticeQ.shift();
    if (now - it.at > it.maxWait) continue;             // chờ quá lâu: bỏ
    noticeCur = it; it.startAt = now; it.endAt = now + it.dur; it.show();
    return;
  }
}
setInterval(noticeStep, 100);

const simpleCard = (el, text) => ({ show(){ el.textContent = text; el.classList.add('show'); }, hide(){ el.classList.remove('show'); } });

function splitChant(text, maxLen = 95){
  text = String(text || '').trim();
  if (!text) return [];
  if (text.length <= maxLen) return [text];
  const raw = text.split(/(?<=[.,;!?])\s+/);
  const segments = [];
  for (const s of raw){
    if (s.length <= maxLen) { segments.push(s); continue; }
    const words = s.split(/\s+/);
    let cur = '';
    for (const w of words){
      if (!cur) cur = w;
      else if ((cur + ' ' + w).length <= maxLen) cur += ' ' + w;
      else { segments.push(cur); cur = w; }
    }
    if (cur) segments.push(cur);
  }
  const parts = [];
  let curPart = '';
  for (const seg of segments){
    if (!curPart) curPart = seg;
    else if ((curPart + ' ' + seg).length <= maxLen) curPart += ' ' + seg;
    else { parts.push(curPart); curPart = seg; }
  }
  if (curPart) parts.push(curPart);
  return parts.length ? parts : [text];
}
function showChant(text){
  if (noticeCur || noticeQ.length) return;               // đang bận thì bỏ lượt chữ (giọng đọc vẫn đọc bình thường)
  const parts = splitChant(text, 95);
  if (!parts.length) return;
  const el = $el('chant');
  parts.forEach((part, i) => {
    const dur = Math.max(5000, Math.min(9000, part.length * 90));
    noticeEnqueue({
      type: 'chant',
      prio: 0,
      dur,
      maxWait: 30000,
      show(){ $el('chantText').textContent = part; el.classList.add('show'); },
      hide(){ el.classList.remove('show'); }
    });
  });
}

let AC=null, master=null, musicGain=null, sfx=null, settings={ music:true, mo:true, moBpm:52, scene:'auto', zoomEnabled:true, musicTrack:'shuffle' };
const TRACKS=['/assets/music/music1.mp3','/assets/music/music2.mp3','/assets/music/music3.mp3','/assets/music/music4.mp3','/assets/music/music5.mp3'];
let musicEl=null, trackMode='shuffle', bag=[], lastTrack=-1;
// Phát ngẫu nhiên không lặp: "túi" các bài xáo trộn, lấy hết túi mới xáo lại (bài đầu túi mới khác bài vừa phát). Chế độ chọn bài: lặp đúng bài đó.
function pickTrack(){
  if (settings.musicTrack && settings.musicTrack!=='shuffle'){ const i=(+settings.musicTrack)-1; if (i>=0 && i<TRACKS.length) return i; }
  if (!bag.length){
    bag=TRACKS.map((_,i)=>i);
    for (let i=bag.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [bag[i],bag[j]]=[bag[j],bag[i]]; }
    if (bag.length>1 && bag[bag.length-1]===lastTrack) [bag[0],bag[bag.length-1]]=[bag[bag.length-1],bag[0]];
  }
  return bag.pop();
}
document.getElementById('unmute').onclick = e => { e.currentTarget.remove(); startAudio(); };
function startAudio(){
  AC = new (window.AudioContext||window.webkitAudioContext)();
  AC.resume?.().catch(()=>{});
  master = AC.createGain(); master.gain.value=.9; master.connect(AC.destination);
  musicGain = AC.createGain(); musicGain.gain.value=settings.music?.5:0; musicGain.connect(master);
  sfx = AC.createGain(); sfx.gain.value=1; sfx.connect(master);
  nextTrack(); scheduleMo(); bell(); playTTS();
}
// Chỉ MỘT phần tử Audio cho nhạc nền, nối vào đồ thị âm thanh đúng một lần; đổi bài = đổi src. (Mỗi lần new Audio + createMediaElementSource
// đều bị Chrome giữ lại mãi: rò listener và node DOM.)
function nextTrack(){
  if (!musicEl){
    musicEl = new Audio(); const src=AC.createMediaElementSource(musicEl); src.connect(musicGain);
    musicEl.onended = nextTrack;
  }
  const i=pickTrack(); lastTrack=i; trackMode=settings.musicTrack||'shuffle';
  musicEl.src = TRACKS[i]; musicEl.play().catch(()=>{});
}
function duck(on){ if(!musicGain) return; const t=AC.currentTime, target = !settings.music ? 0 : on ? .14 : .5; musicGain.gain.cancelScheduledValues(t); musicGain.gain.setValueAtTime(musicGain.gain.value,t); musicGain.gain.linearRampToValueAtTime(target,t+.5); }
let haloPulse=0;
function bell(big){
  if(!AC) return; const t=AC.currentTime, k=big?1.7:1;
  for (const [f,a,d] of [[216,.55,7],[432,.35,5],[1296,.12,3],[2160,.05,2]]) { const o=AC.createOscillator(); o.type='sine'; o.frequency.value=f*(big?.75:1); const g=AC.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(a*k*.7,t+.015); g.gain.exponentialRampToValueAtTime(.0005,t+d*k); o.connect(g); g.connect(sfx); o.start(t); o.stop(t+d*k+.1); }
  haloPulse=1;
}
function chimeOracle(){
  if(!AC) return; const t=AC.currentTime;
  for (const [f,a,d] of [[528,.22,2.6],[1056,.10,1.8],[1584,.05,1.2]]) {
    const o=AC.createOscillator(); o.type='sine'; o.frequency.value=f;
    const g=AC.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(a,t+.02); g.gain.exponentialRampToValueAtTime(.0005,t+d);
    o.connect(g); g.connect(sfx); o.start(t); o.stop(t+d+.05);
  }
}
function mo(){
  if(!AC) return; const t=AC.currentTime;
  const o=AC.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(620,t); o.frequency.exponentialRampToValueAtTime(380,t+.05);
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=700; bp.Q.value=3; const g=AC.createGain(); g.gain.setValueAtTime(.35,t); g.gain.exponentialRampToValueAtTime(.001,t+.14);
  o.connect(bp); bp.connect(g); g.connect(sfx); o.start(t); o.stop(t+.16);
}
let moTimer=null; function scheduleMo(){ clearInterval(moTimer); if (AC && settings.mo) moTimer=setInterval(mo, 60000/Math.max(20,settings.moBpm||52)); }

// Hàng đợi phát giọng đọc tuần tự ở Client (chống chồng lấp, phát .mp3 Edge TTS)
const ttsQ=[]; let ttsPlaying=false;
function queueTTS(url, onStart){ if (ttsQ.length < 25) ttsQ.push({url,onStart}); playTTS(); }
// Giọng đọc: cũng chỉ MỘT phần tử Audio + một nút nguồn + một gain, dùng lại cho mọi câu (xem ghi chú ở nextTrack).
// Mỗi câu chỉ gán handler (thuộc tính on…, ghi đè chứ không cộng dồn) và đổi src; phát xong thì gỡ handler và bỏ nguồn để nhả bộ đệm âm thanh.
let ttsEl=null;
function ttsElement(){
  if (!ttsEl){ ttsEl=new Audio(); const src=AC.createMediaElementSource(ttsEl); const g=AC.createGain(); g.gain.value=1.25; src.connect(g); g.connect(master); }
  return ttsEl;
}
function playTTS(){
  if (ttsPlaying || !ttsQ.length || !AC) return;
  ttsPlaying=true;
  const {url,onStart}=ttsQ.shift();
  const el=ttsElement();
  let done=false, watchdog=null;
  const finish=delay=>{
    if(done) return; done=true; clearTimeout(watchdog);
    el.onplay=el.onended=el.onerror=null;
    try{ el.pause(); el.removeAttribute('src'); el.load(); }catch{}
    duck(false); ttsPlaying=false; setTimeout(playTTS,delay);
  };
  el.onplay=()=>{ duck(true); onStart&&onStart(); };
  el.onended=el.onerror=()=>finish(380);
  watchdog=setTimeout(()=>finish(0),90000);   // chốt chặn: câu kẹt (không ended, không error) không được chặn hàng đợi mãi
  el.src=url; el.play().catch(()=>finish(400));
}

/* ======================= effects ======================= */
const fx=[], petals=[];
const FACE={x0:400,x1:680,y1:620};   // vùng mặt tượng: cánh hoa không được qua
const FX_MAX=40, PETAL_MAX=260, freeFx=[], freePetals=[];   // object pool có trần: quá trần thì bỏ bớt hiệu ứng mới, hết hạn thì tái sử dụng
function addFx(kind,x,y,life,scale){ if (fx.length>=FX_MAX) return; const f=freeFx.pop()||{}; f.kind=kind; f.x=x; f.y=y; f.t=0; f.life=life; f.scale=scale; fx.push(f); }
function addPetal(x,y,vx,vy,life,s,heart){ if (petals.length>=PETAL_MAX) return; const p=freePetals.pop()||{}; p.x=x; p.y=y; p.vx=vx; p.vy=vy; p.t=0; p.life=life; p.s=s; p.heart=!!heart; p.ph=Math.random()*20; petals.push(p); }
function giftFx(v, m){
  const tier = m.tier || 1;
  v.glow = 1;
  // Kích hoạt lễ lạy 12-frame (quà lớn lạy 3 lễ chí thành, quà thường lạy 1 lễ) -> xong lễ tự bật Hào Quang Hoa Sen 5 phút!
  v.triggerBow(tier >= 3 ? 3 : 1, tier);

  // Kích hoạt Khói Trầm Lư Hương tương tác nếu là quà quý (Hoa sen, Rồng, Chuông vàng, Kim cương...)
  if (m.incenseBoost || tier >= 2) {
    incenseFX.triggerSacredOffering(tier);
  }
  // Quà ≥ 99 xu: chỉ hiện Sổ Vàng Công Đức (qua hàng đợi thông báo); quà nhỏ: chỉ thẻ 1 dòng
  if (tier >= 3) showMeritScroll(m);

  const kind = tier>=3?'bell':tier>=2?'lotus':'incense', s=v.scale||.4;
  addFx(kind, v.x, v.y-220*s, tier>=3?3.4:2.4, s*(tier>=3?1.5:1.1));
  for (let i=0;i<(tier>=3?22:tier>=2?12:5);i++) addPetal(v.x+(Math.random()-.5)*120, v.y-80, (Math.random()-.5)*40, -(70+Math.random()*90), 2.6+Math.random(), .16+Math.random()*.14);
  if (tier>=3){ bell(true); for (let i=0;i<30;i++){ const side=Math.random()<.5; addPetal(side ? 60+Math.random()*320 : 700+Math.random()*320, 300+Math.random()*250, (side?-1:1)*Math.random()*30, 30+Math.random()*50, 5, .2+Math.random()*.15); } }   // mưa hoa rơi hai bên, không qua vùng mặt tượng
}
function hearts(v,n){ for (let i=0;i<Math.min(6,n);i++) addPetal(v.x+(Math.random()-.5)*60, v.y-140*(v.scale||.4), (Math.random()-.5)*20, -(50+Math.random()*40), 1.6, .08, true); }

let ws=null;
function connect(){
  ws = new WebSocket(`ws://${location.host}/ws?role=overlay`);
  const st=document.getElementById('conn');
  ws.onopen=()=>{ st.textContent=''; };
  ws.onclose=()=>{ st.textContent=L('lost','mất kết nối server… đang thử lại'); setTimeout(connect,2000); };
  ws.onmessage=e=>{ let m; try { m=JSON.parse(e.data); } catch { return; } handleMsg(m); };
}
function handleMsg(m){
    switch(m.t){
      case 'batch': for (const x of (Array.isArray(m.msgs) ? m.msgs : [])){ try { handleMsg(x); } catch (err) { console.error('[overlay] lỗi xử lý bản tin', x && x.t, err); } } break;
      case 'state':
        loadPoseFiles(m.poseFiles);
        ceremonyManager.reset(visitors);
        applyContent(m.content);
        Object.assign(settings,m.settings); applySettings(); startedAt=m.startedAt; silentUntil=m.silentUntil||0;
        visitors.clear(); order=[]; layout(m.cap); m.viewers.forEach((p,i)=>addVisitor(p,true,i)); setMore(m.more); updateCount(); renderMerit(); break;
      case 'more': setMore(m.n); break;
      case 'settings': Object.assign(settings,m.settings); applySettings(); if (m.cap!==cap){ layout(m.cap); updateCount(); } break;
      case 'silent': silentUntil=m.silentUntil||0; break;
      case 'zoom': { const v=visitors.get(m.id); if(v && !v.inCeremony && settings.zoomEnabled!==false && Date.now()>=silentUntil) cameraZoom.trigger(m, v); } break;
      case 'ceremony': {
        const inviteTxt = m.inviteText || fillTpl(CONTENT?.ceremony?.inviteText ?? '🙏 Mời Phật tử {name} lên lễ Phật', { name: m.name });
        if (m.bow) setBowConfig(m.bow);
        touch(m.id);
        ceremonyManager.gridRows = (GRID[cap] || GRID[24])[1];
        showCeremonyInvite(inviteTxt, +m.inviteSec || CONTENT?.ceremony?.inviteSec || 3);
        ceremonyManager.start(m, visitors, LAYOUT.altarSpot, FLOOR, currentCols());
        break;
      }
      case 'join': if (m.cap!==cap) layout(m.cap); addVisitor(m.v, m.v.demo && visitors.size>8); updateCount(); break;
      case 'leave': removeVisitor(m.id); updateCount(); renderMerit(); break;
      case 'skin': { const v=touch(m.id); if(v){ v.skin=m.skin; v.glow=.85; v.triggerBow(1,0); } } break;
      case 'chat': { const v=touch(m.id); if(v){ v.bubble={text:m.text, until:performance.now()+6000}; if(!v.isBowing) v.triggerBow(1,0); } } break;
      case 'oracle': { const v=touch(m.id); if(v){ v.glow=.9; v.triggerBow(1,0); } enqueueOracle(m); } break;
      case 'gift': { const v=touch(m.id); if(v){ v.coins=m.total; giftFx(v,m); } renderMerit(); if ((m.tier||1) < 3) showGift(m); } break;
      case 'like': { const v=touch(m.id); if(v) hearts(v,m.n); } break;
      case 'tts': queueTTS(m.url); break;
      case 'chant': showChant(m.text); bell(); break;
      case 'bell': bell(true); break;
      case 'music_next': if (musicEl && (settings.musicTrack||'shuffle')==='shuffle') nextTrack(); break;
      case 'mo1': mo(); break;
      case 'follow': { const v=touch(m.id); if(v){ v.glow=1; v.triggerBow(1,0); } for (let i=0;i<3;i++) setTimeout(mo, i*520); } break;
      case 'share': bell(false); showToast(fillTpl(CONTENT?.share?.text ?? '🙏 {name} đã chia sẻ', {name:m.name}), CONTENT?.share?.showSec ?? 4); break;
      case 'milestone': bell(true); showToast(fillTpl(CONTENT?.milestone?.text ?? '♥ {n} trái tim ♥', {n:m.n}), CONTENT?.milestone?.showSec ?? 5); break;
    }
}

  if (plqText) plqText.textContent = settings.plaqueText || CONTENT?.plaque?.text || 'Nam Mô A Di Đà Phật';

const mainCtx=mainCanvas.getContext('2d');

function tag(text,x,y,s,style,av,maxW){
  const fs=Math.max(15,Math.round(30*s/.4)); ctx.font=`600 ${fs}px "Be Vietnam Pro",system-ui,sans-serif`;
  const pad=fs*.5; let aw = av?fs*1.15:0;
  if (maxW){ if (aw && maxW < fs*5) aw=0, av=null; let t=text; while (t.length>2 && ctx.measureText(t).width+pad*2+aw > maxW) t=t.slice(0,-1); if (t!==text) text=t.trimEnd()+'…'; }
  const w=ctx.measureText(text).width+pad*2+aw, h=fs*1.5;
  ctx.fillStyle = style==='gold'?'rgba(70,30,8,.92)':'rgba(18,9,5,.72)'; rr(x-w/2,y-h/2,w,h,h/2); ctx.fill();
  ctx.lineWidth = style==='gold'?3:1.5; ctx.strokeStyle = style==='gold'?'#e2b04f':'rgba(226,176,79,.55)'; ctx.stroke();
  if (av){ ctx.save(); ctx.beginPath(); ctx.arc(x-w/2+pad*.55+aw/2, y, fs*.5, 0, 6.29); ctx.clip(); ctx.drawImage(av, x-w/2+pad*.55+aw/2-fs*.5, y-fs*.5, fs, fs); ctx.restore(); }
  ctx.fillStyle = style==='gold'?'#ffd98a':'#f6e9cf'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(text, x+aw/2, y+1);
}
// Nhãn trên đầu (chỉ 30 người hoạt động gần nhất): vòng tròn đại diện avatarPx, tên ngay dưới vòng tròn, sát đỉnh đầu. Chữ rút gọn theo layout.v3.labels.nameMax.
function drawLabel(v, headY, alpha){
  // Nhãn dựng sẵn thành MỘT ảnh nhỏ cho mỗi người (đổi tên / ảnh đại diện / mốc quà mới dựng lại), mỗi khung chỉ một drawImage
  const LB = V3.labels, px = LB.avatarPx, fs = LB.nameFontPx, nm = String(v.name || '');
  const im = avatar(v.avatar), gold = v.coins >= 99, key = nm + '|' + (gold ? 1 : 0) + '|' + (im ? im.src : 'L');
  if (v._lbKey !== key){
    const name = Array.from(nm).length > LB.nameMax ? Array.from(nm).slice(0, LB.nameMax - 1).join('').trimEnd() + '…' : nm;
    const font = `600 ${fs}px "Be Vietnam Pro",system-ui,sans-serif`, m = (v._lbCan || (v._lbCan = document.createElement('canvas'))), mx = m.getContext('2d');
    mx.font = font; const tw = mx.measureText(name).width, h = Math.round(fs * 1.4), w = Math.ceil(Math.max(px, tw + 12)) + 2, H = px + 3 + h;
    m.width = w; m.height = H;                                   // đổi kích thước canvas tự xoá nội dung
    mx.drawImage(avatarCircle(v, px), (w - px) / 2, 0, px, px);
    mx.fillStyle = 'rgba(18,9,5,.74)'; mx.beginPath(); if (mx.roundRect) mx.roundRect((w - tw - 12) / 2, px + 3, tw + 12, h, h / 2); else mx.rect((w - tw - 12) / 2, px + 3, tw + 12, h); mx.fill();
    mx.font = font; mx.fillStyle = gold ? '#ffd98a' : '#f6e9cf'; mx.textAlign = 'center'; mx.textBaseline = 'middle'; mx.fillText(name, w / 2, px + 3 + h / 2 + 1);

  ctx.drawImage(v._lbCan, Math.round(Math.max(8, Math.min(1072 - v._lbW, v.x - v._lbW / 2))), Math.round(headY - 4 - v._lbH));   // thẻ tên không bao giờ vượt mép 8–1072

function bubble(text,x,y,s){
  const fs=Math.max(18,Math.round(26*s/.4)); ctx.font=`500 ${fs}px "Be Vietnam Pro",system-ui,sans-serif`;
  let t=text; while (ctx.measureText(t).width>320 && t.length>4) t=t.slice(0,-2); if (t!==text) t=t.trimEnd()+'…';
  const w=ctx.measureText(t).width+fs*1.1, h=fs*1.6;

  ctx.beginPath(); ctx.moveTo(x-8,y); ctx.lineTo(x+8,y); ctx.lineTo(x,y+10); ctx.fill();
  ctx.fillStyle='#3a1a08'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(t,x,y-h/2+1);
}

/* ---- Lớp tĩnh vẽ sẵn vào canvas ẩn: nền (hall) và 6 vị thầy + thẻ tên (tách đôi quanh thầy trụ trì để hào quang vẫn nằm đúng giữa).

let buddhaGlowFX = null;

}
const BUDDHA_GLOW_DEFAULT={ head:{x:540,y:355,r:175,alpha:.38}, body:{x:540,y:625,rx:195,ry:285,alpha:.26}, breathSec:7, breathAmp:.22, nightBoost:1.35, vignette:{alpha:.18,size:260} };

function drawVignette(c){

  const edge=(x0,y0,x1,y1,rx,ry,rw,rh)=>{ const g=c.createLinearGradient(x0,y0,x1,y1); g.addColorStop(0,`rgba(0,0,0,${a})`); g.addColorStop(1,'rgba(0,0,0,0)'); c.fillStyle=g; c.fillRect(rx,ry,rw,rh); };
  edge(0,0,0,n,0,0,1080,n); edge(0,1920,0,1920-n,0,1920-n,1080,n); edge(0,0,n,0,0,0,n,1920); edge(1080,0,1080-n,0,1080-n,0,n,1920);   // 4 mép tối dần vào trong
}
const mkLayer=()=>{ const c=document.createElement('canvas'); c.width=1080; c.height=1920; return c; };
let bgFrom=document.getElementById('bgA'), bgTo=document.getElementById('bgB'); const staticT1=mkLayer(), staticT2=mkLayer();   // bgTo = cảnh hiện tại, bgFrom = cảnh trước (chỉ dùng trong 2 giây mờ chéo)
let bgToScene='', bgToValid=false, fadeStart=-1e9;
let layoutVer=0, staticKey='', fontsOk=false, TAG_GAP=22;   // TAG_GAP: khoảng cách thẻ tên thầy tới đỉnh đầu (content.json → layout.teacherTagGap)
const tagFont = tc => { const fs = Math.max(15, Math.round(30 * tc.s / .4)); return [fs, `600 ${fs}px "Be Vietnam Pro",system-ui,sans-serif`]; };
function drawTeachers(from, to, crowded){

// Hiển thị hai lớp nền DOM. Cảnh ảnh mới: lớp "tới" mờ dần 0→1 trong scene.fadeSec giây bằng CSS (lớp "từ" nằm dưới, tắt sau khi xong).
// Chánh điện cũ: ẩn cả hai lớp DOM, canvas chính tự vẽ nền (cần cộng sáng lên nền như trước).
let bgFadeToken = 0;
function showBgLayers(legacy, swapped){
  const tok = ++bgFadeToken;
  if (legacy){ bgFrom.style.opacity = bgTo.style.opacity = '0'; return; }
  bgTo.style.zIndex = '1'; bgFrom.style.zIndex = '0';
  if (!swapped){ bgTo.style.transition = 'none'; bgTo.style.opacity = '1'; bgFrom.style.opacity = '0'; return; }
  const sec = Math.max(0, sceneCfg().fadeSec);
  bgTo.style.transition = 'none'; bgTo.style.opacity = '0'; void bgTo.offsetWidth;
  bgTo.style.transition = `opacity ${sec}s linear`; bgTo.style.opacity = '1';
  setTimeout(() => { if (tok === bgFadeToken) bgFrom.style.opacity = '0'; }, sec * 1000 + 100);

let bgXform = '';
function applyBgZoom(css){   // lớp nền DOM phóng to/dịch cùng camera zoom của canvas chính
  if (css === bgXform) return; bgXform = css; bgFrom.style.transform = bgTo.style.transform = css || '';
}
function renderStatic(){

  if (bgToValid && bgToScene !== sc && !(im && im.naturalWidth)) return;   // ảnh cảnh mới chưa nạp xong: giữ cảnh cũ, khoá khoá tĩnh đổi khi ảnh tới thì vẽ lại
  const swapped = bgToValid && bgToScene !== sc;
  if (swapped){ [bgFrom, bgTo] = [bgTo, bgFrom]; fadeStart = performance.now(); }   // đổi cảnh: giữ cảnh cũ làm lớp "từ", vẽ cảnh mới vào lớp "tới"
  const bg=bgTo.getContext('2d'); bg.clearRect(0,0,1080,1920);

let lastDraw=performance.now(), lastProfileV3=null;
function frame(now){
  requestAnimationFrame(frame);
  if (now - lastDraw < MIN_FRAME_MS) return;      // giới hạn 30 fps; mọi chuyển động tính theo dt nên tốc độ không đổi
  const dt=Math.min((now-lastDraw)/1000,.1); lastDraw=now; const t=now/1000;
  const sk=staticKeyNow(); if (sk!==staticKey){ staticKey=sk; renderStatic(); }
  ctx.clearRect(0,0,1080,1920);

  const cols = currentCols();
  for (const v of visitors.values()) v.update(dt, now, FLOOR, cols);
  ceremonyManager.update(dt, now, visitors, FLOOR, cols, { incenseFX, onSmallBell: () => bell(false) });
  cameraZoom.update(dt, visitors, settings.zoomEnabled !== false, Date.now() < silentUntil);

  cameraZoom.applyTransform(ctx);
  // Nền: cảnh hiện tại; đang đổi cảnh thì mờ chéo từ cảnh cũ sang cảnh mới trong scene.fadeSec giây (chỉ lúc đó mới vẽ hai lớp)
  const sceneNow = resolveScene(), legacy = sceneNow === 'old', fadeMs = Math.max(1, sceneCfg().fadeSec * 1000);
  applyBgZoom(legacy ? '' : cameraZoom.cssTransform());
  if (legacy){
    if (now - fadeStart < fadeMs){
      ctx.drawImage(bgFrom,0,0); ctx.globalAlpha = (now - fadeStart) / fadeMs; ctx.drawImage(bgTo,0,0); ctx.globalAlpha = 1;
    } else ctx.drawImage(bgTo,0,0);
  }

  haloPulse=Math.max(0,haloPulse-dt*.4);
  if (legacy){
    // 1. Chánh điện cũ: ánh sáng & thời tiết bằng code (ban ngày nắng cửa sổ / ban đêm nến & đèn dầu)
    const dayNow = sceneIsDay(sceneNow);
    ambientFX.drawBackgroundLighting(ctx, dt, t, dayNow ? 'day' : 'night', { shadeBaked: true });
    // 2. Hào quang tượng Phật (halo tròn sau đầu + mandorla elip thân)
    drawBuddhaGlow(t, dayNow, haloPulse * 0.35);
  } else {
    // Cảnh ảnh mới: không tối nền, không hào quang elip/hốc cũ; chỉ một sprite hào quang nhẹ "thở" sau đầu Phật (chuông ngân làm sáng thêm)
    const gfx = getBuddhaGlowFX(), hc = sceneCfg().halo;
    if (gfx) gfx.drawHalo(ctx, t, { ...hc, alpha: hc.alpha + haloPulse * 0.1 });
  }

  // 3. Lư Hương Lửa & Khói Trầm Tương Tác (Perlin Noise + Sine Wave drift)
  incenseFX.updateAndDraw(ctx, dt, t, 540, LAYOUT.incense.y);

  // 4. Sáu vị thầy hai bên bàn thờ (lối giữa để trống): vẽ từ lớp tĩnh; hào quang thầy trụ trì vẫn vẽ mỗi khung, nằm giữa hai nửa lớp.
  if (legacy){
    ctx.drawImage(staticT1,0,0);
    const master=TEACHERS.find(tc=>tc.master);
    if (master){ ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=.35+.1*Math.sin(t*1.5); sprite(A.halo,master.x,master.y-120,.9,.5); ctx.restore(); }
    ctx.drawImage(staticT2,0,0);
  }

  // 5. Phật tử ngồi thiền & hành lễ (cập nhật Lerp + Perspective Scaling + 12-Frame Bowing + Lotus Aura 5 phút)
  const bubbles=[], labels=[], v3=!legacy;
  if (v3 !== lastProfileV3){   // đổi giữa Chánh điện cũ ↔ cảnh ảnh mới: đặt lại các lượt lễ, xếp lại chỗ ngồi tức thì
    lastProfileV3 = v3; ceremonyManager.reset(visitors); reseat();
    for (const v of visitors.values()) if (v.seat) v.assignSeat(v.seat, true, FLOOR, cols);
  }
  if (now - activeAt > 500){ activeAt = now; refreshActive(V3 ? V3.labels.recentMax : 30); }
  const list=[...visitors.values()].sort((a,b)=>a.y-b.y);
  for (const v of list){
    const effAlpha = v.getEffectiveAlpha();
    if (effAlpha <= 0.004) continue;
    cameraZoom.drawCharacterAuraRing(ctx, v, t);
    const topY = v.draw(ctx, t, now, A);
    const ws = v.scale;
    // Người ở altarSpot: thẻ tên đặt dưới bồ đoàn (không che thẻ các thầy / đầu người lễ)
    const ty = v.atAltarSpot ? v.y + 16 * ws / .4 + 0.75 * Math.max(15, Math.round(30 * ws / .4)) : v.y - topY - 14 * ws / .4;
    const avImg = (!v3 || cameraZoom.isHighlighting(v)) ? avatar(v.avatar) : null;
    const zoomedHideNormalTag = cameraZoom.drawZoomedNameplate(ctx, v, topY, t, avImg);
    if (v3){
      if (!zoomedHideNormalTag && activeSet.has(v.id)){
        const headY = v.y - topY;
        labels.push([v, headY, effAlpha]);
        if (!v.atAltarSpot && v.bubble && now<v.bubble.until) bubbles.push([v.bubble.text, v.x, headY - V3.labels.avatarPx - V3.labels.nameFontPx * 1.6 - 12, ws, effAlpha]); else if (v.bubble && now>=v.bubble.until) v.bubble=null;
      } else if (v.bubble && now>=v.bubble.until) v.bubble=null;
    } else if (!zoomedHideNormalTag){
      ctx.save();
      ctx.globalAlpha = effAlpha;
      const tagStyle = (v.atAltarSpot || v.skin==='master' || v.coins>=99) ? 'gold' : '';
      const maxTagW = (!v.atAltarSpot && !v.walkControlled && v.state==='sit') ? v.seat?.gap : 0;
      tag(v.name, v.x, ty, ws, tagStyle, avImg, maxTagW);
      ctx.restore();
    }
    if (!v3){ if (!v.atAltarSpot && v.bubble && now<v.bubble.until) bubbles.push([v.bubble.text, v.x, ty-Math.max(18,30*ws/.4), ws, effAlpha]); else if (v.bubble && now>=v.bubble.until) v.bubble=null; }
  }
  for (const [lv, lh, la] of labels) drawLabel(lv, lh, la);
  for (const [bt, bx, by, bs, ba] of bubbles){ ctx.save(); ctx.globalAlpha = ba; bubble(bt, bx, by, bs); ctx.restore(); }

  // 6. Vật phẩm cúng dường bay lên, cánh sen & tim (hạt hết hạn trả về pool)
  let wf=0;
  for (let i=0;i<fx.length;i++){ const f=fx[i]; f.t+=dt; const k=f.t/f.life; if(k>=1){ freeFx.push(f); continue; } const pop=1-Math.pow(1-Math.min(1,f.t*4),3);
    ctx.save(); ctx.globalAlpha=k<.75?1:(1-k)/.25; sprite(A[f.kind],f.x,f.y-k*170,f.scale*(.6+.4*pop)); ctx.restore(); fx[wf++]=f; }
  fx.length=wf;
  let wp=0;
  for (let i=0;i<petals.length;i++){ const p=petals[i]; p.t+=dt; if(p.t>p.life){ freePetals.push(p); continue; } p.x+=p.vx*dt+Math.sin(p.t*3+p.ph)*20*dt; p.y+=p.vy*dt;
    if (p.y<FACE.y1 && p.x>FACE.x0 && p.x<FACE.x1){ p.x = p.x<540 ? FACE.x0 : FACE.x1; p.vx = (p.x<540?-1:1)*Math.abs(p.vx); }   // cánh hoa không bay qua vùng mặt (x 400–680, y 240–620)
    ctx.save(); ctx.globalAlpha=Math.min(1,p.life-p.t); ctx.translate(p.x,p.y);
    if (p.heart){ ctx.fillStyle='#ff5a7a'; ctx.font='34px serif'; ctx.textAlign='center'; ctx.fillText('♥',0,0); } else { ctx.rotate(Math.sin(p.t*2+p.ph)*.6); sprite(A.petal,0,0,p.s,.5); }
    ctx.restore(); petals[wp++]=p; }
  petals.length=wp;
  cameraZoom.restoreTransform(ctx);

  // 7. Sổ Vàng Công Đức Cuộn Thư Pháp 2.5D
  meritScroll.updateAndDraw(ctx, dt, t, A.lotus);

  // 8. Dòng tri ân tác giả gốc
  drawCredit(now);
}

const credit = { enabled:true, text:'✦ Mã nguồn được chia sẻ bởi Kent Juno ✦', everyMin:[5,10], showSec:7, y:1222, fontPx:22 };
let creditNext = 0, creditStart = -1e9;
function drawCredit(now){
  if (!credit.enabled || !credit.text) return;
  const [lo, hi] = credit.everyMin;
  if (!creditNext) creditNext = now + (lo + Math.random()*(hi-lo))*60000;
  if (now > creditNext){ creditStart = now; creditNext = now + (lo + Math.random()*(hi-lo))*60000; }
  const e = (now - creditStart)/1000, dur = credit.showSec;
  if (e < 0 || e > dur) return;
  const k = Math.max(0, Math.min(1, e*1.6, (dur-e)*1.6)), h = Math.round(credit.fontPx*1.7);
  ctx.save(); ctx.setTransform(ctx.canvas.width/1080, 0, 0, ctx.canvas.height/1920, 0, 0); ctx.globalAlpha = k;
  ctx.font = `600 ${credit.fontPx}px "Noto Serif",Georgia,serif`;
  const w = ctx.measureText(credit.text).width + 44, x = 540 - w/2, y = credit.y - h/2;
  ctx.fillStyle = 'rgba(40,16,6,.88)'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, h/2) : ctx.rect(x, y, w, h); ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(226,176,79,.9)'; ctx.stroke();
  ctx.fillStyle = '#ffd98a'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(credit.text, 540, credit.y + 1);
  ctx.restore();
}
layout(24); updateAmbientBadge();
// Chờ phông chữ (Noto Serif, Be Vietnam Pro) nạp xong rồi mới vẽ khung đầu, để thẻ tên/Sổ Vàng không đo chữ bằng phông dự phòng. Quá 4s thì vẽ luôn.
Promise.race([
  Promise.all(['600 30px "Be Vietnam Pro"','500 26px "Be Vietnam Pro"','700 24px "Noto Serif"','italic 700 42px "Noto Serif"'].map(f=>document.fonts.load(f).catch(()=>[]))).then(()=>document.fonts.ready),
  new Promise(r=>setTimeout(r,4000)),
]).catch(()=>{}).then(()=>{ fontsOk=true; lastDraw=performance.now(); requestAnimationFrame(frame); });
</script>
